<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.1" />
    <title>Grid Practice</title>
    <style>
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(mn(100%, 220px),1fr));
        grid-template-rows: auto 1fr;
        gap: 24px;
      }

      .stats-card {
        padding: 24px;
        background: #e8eefc;
        border-radius: 10px;
      }

      .analytics{
        grid-column: span 2;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      
    </style>
  </head>

  <body>
    <div class="stats-grid">
      <article class="stat-card">Revenue</article>
      <article class="stat-card">Users</article>
      <article class="stat-card">Orders</article>
      <article class="stat-card">Growth</article>
    </div>
  </body>
</html>
